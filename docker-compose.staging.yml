version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: goonstay_staging_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: goonstay_staging_db
      POSTGRES_USER: goonstay_staging_user
      POSTGRES_PASSWORD: StagingSecurePass2026!
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goonstay_staging_user -d goonstay_staging_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: goonstay_staging_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ""
    volumes:
      - redis_staging_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goonstay_staging_web
    restart: unless-stopped
    command: gunicorn config.wsgi:application -c gunicorn_config.py
    env_file:
      - .env.staging
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goonstay_staging_celery_worker
    restart: unless-stopped
    command: celery -A config worker --loglevel=info --concurrency=4
    env_file:
      - .env.staging
    volumes:
      - media_volume:/app/media
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goonstay_staging_celery_beat
    restart: unless-stopped
    command: celery -A config beat --loglevel=info
    env_file:
      - .env.staging
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: goonstay_staging_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/goonstay_staging.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web

volumes:
  postgres_staging_data:
  redis_staging_data:
  static_volume:
  media_volume:
